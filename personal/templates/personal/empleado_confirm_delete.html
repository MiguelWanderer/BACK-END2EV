{% extends 'personal/base.html' %}
{% block title %}Eliminar empleado{% endblock %}
{% block content %}
<h1>Confirmar eliminación</h1>
<div class="panel">
    <p>¿Está seguro de que desea eliminar al empleado <strong>{{ empleado.nombre }} {{ empleado.apellido }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button class="button accent" type="submit">Sí, eliminar</button>
        <a class="button muted" href="{% url 'personal:empleado_detail' empleado.pk %}">Cancelar</a>
    </form>
</div>
{% endblock %}
